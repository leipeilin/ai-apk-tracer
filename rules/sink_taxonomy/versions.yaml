schema_version: "1.0"
taxonomy_version: "1.0.0"
description: >-
  sink taxonomy 版本化文件（T2.9，方案 §2.2/§2.5）：backend 侧
  custom_sink_proposal 判定的独立数据源（零依赖红线——backend 不 import
  rules 模块，本文件是唯一共享数据层）。种子（source=base）自
  rules/shared/dataflow.py classify_operation_taxonomy 提炼的高置信度
  子集（同名异义靠 receiver 消歧；构造器/参数字面量/resolved_wrapper
  等不可数据化分支未收录——rules 侧迭代时 base 条目需人工同步本文件）。
  人工确认扩展（source=manual）经 scripts/promote_custom_sink.py 追加
  （taxonomy_version 递增；单人操作约定——并发 promote 的版本冲突在
  git 层解决）。匹配语义：method 精确匹配 + receiver 三态约束
  （leaves=末段提取宽匹配 / prefixes=包前缀 / exact=FQCN）；receiver
  证据缺失时宽松命中（与 rules 侧空值失配口径的主动偏离——索引
  receiver 缺失常见，严格失配伤召回）。arities 为结构预留（空=不校验）。
entries:
  # ---- ui_navigation ----
  - {method: forName, receiver_leaves: [Class], taxonomy: ui_navigation, source: base}
  - {method: getDeclaredConstructor, receiver_leaves: [Class], taxonomy: ui_navigation, source: base}
  - {method: getConstructor, receiver_leaves: [Class], taxonomy: ui_navigation, source: base}
  - {method: startActivity, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: ui_navigation, source: base}
  - {method: startActivities, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: ui_navigation, source: base}
  - {method: navigate, receiver_prefixes: ["androidx.navigation."], taxonomy: ui_navigation, source: base}
  - {method: instantiate, receiver_leaves: [FragmentFactory], taxonomy: ui_navigation, source: base}
  # ---- connection_session_control ----
  - {method: startService, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: connection_session_control, source: base}
  - {method: startForegroundService, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: connection_session_control, source: base}
  - {method: bindService, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: connection_session_control, source: base}
  - {method: stopSelf, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: connection_session_control, source: base}
  - {method: startForeground, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: connection_session_control, source: base}
  - {method: connect, receiver_leaves: [BluetoothGatt, BluetoothSocket, WifiManager, ConnectivityManager, Socket, UsbDeviceConnection, URLConnection, HttpURLConnection], taxonomy: connection_session_control, source: base}
  - {method: disconnect, receiver_leaves: [BluetoothGatt, BluetoothSocket, WifiManager, ConnectivityManager, Socket, UsbDeviceConnection], taxonomy: connection_session_control, source: base}
  - {method: openConnection, receiver_leaves: [URL, URLConnection], taxonomy: connection_session_control, source: base}
  # ---- callback_event_injection ----
  - {method: sendBroadcast, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: callback_event_injection, source: base}
  - {method: sendOrderedBroadcast, receiver_leaves: [Context, ContextWrapper, Activity, Service], taxonomy: callback_event_injection, source: base}
  - {method: postValue, receiver_leaves: [LiveData, MutableLiveData, EventBus], taxonomy: callback_event_injection, source: base}
  - {method: setValue, receiver_leaves: [LiveData, MutableLiveData], taxonomy: callback_event_injection, source: base}
  - {method: notify, receiver_leaves: [NotificationManager], taxonomy: callback_event_injection, source: base}
  # ---- location_sensor_collection ----
  - {method: requestLocationUpdates, receiver_leaves: [LocationManager], taxonomy: location_sensor_collection, source: base}
  - {method: requestLocationUpdates, receiver_prefixes: ["com.google.android.gms.location."], taxonomy: location_sensor_collection, source: base}
  - {method: getLastLocation, receiver_leaves: [LocationManager], taxonomy: location_sensor_collection, source: base}
  - {method: registerListener, receiver_prefixes: ["android.hardware."], taxonomy: location_sensor_collection, source: base}
  # ---- device_protocol_output ----
  - {method: writeCharacteristic, receiver_leaves: [BluetoothGatt], taxonomy: device_protocol_output, source: base}
  - {method: writeDescriptor, receiver_leaves: [BluetoothGatt], taxonomy: device_protocol_output, source: base}
  - {method: bulkTransfer, receiver_leaves: [UsbDeviceConnection], taxonomy: device_protocol_output, source: base}
  - {method: controlTransfer, receiver_leaves: [UsbDeviceConnection], taxonomy: device_protocol_output, source: base}
  - {method: transceive, receiver_prefixes: ["android.nfc.tech."], taxonomy: device_protocol_output, source: base}
  # ---- persistent_state_write ----
  - {method: putString, receiver_leaves: [Editor], receiver_exact: ["android.content.SharedPreferences$Editor", "android.provider.Settings$Secure", "android.provider.Settings$Global"], taxonomy: persistent_state_write, source: base}
  - {method: remove, receiver_leaves: [Editor], receiver_exact: ["android.content.SharedPreferences$Editor"], taxonomy: persistent_state_write, source: base}
  - {method: apply, receiver_leaves: [Editor], receiver_exact: ["android.content.SharedPreferences$Editor"], taxonomy: persistent_state_write, source: base}
  - {method: commit, receiver_leaves: [Editor], receiver_exact: ["android.content.SharedPreferences$Editor"], taxonomy: persistent_state_write, source: base}
  - {method: updateData, receiver_prefixes: ["androidx.datastore."], taxonomy: persistent_state_write, source: base}
  # ---- database_mutation ----
  - {method: insert, receiver_leaves: [ContentResolver], taxonomy: database_mutation, source: base}
  - {method: insert, receiver_prefixes: ["android.database.sqlite.", "androidx.sqlite.db."], taxonomy: database_mutation, source: base}
  - {method: update, receiver_leaves: [ContentResolver], taxonomy: database_mutation, source: base}
  - {method: update, receiver_prefixes: ["android.database.sqlite.", "androidx.sqlite.db."], taxonomy: database_mutation, source: base}
  - {method: delete, receiver_leaves: [ContentResolver], taxonomy: database_mutation, source: base}
  - {method: delete, receiver_prefixes: ["android.database.sqlite.", "androidx.sqlite.db."], taxonomy: database_mutation, source: base}
  - {method: execSQL, receiver_prefixes: ["android.database.sqlite.", "androidx.sqlite.db."], taxonomy: database_mutation, source: base}
  # ---- data_disclosure ----
  - {method: query, receiver_leaves: [ContentResolver], taxonomy: data_disclosure, source: base}
  - {method: rawQuery, receiver_prefixes: ["android.database.sqlite.", "androidx.sqlite.db."], taxonomy: data_disclosure, source: base}
  - {method: loadUrl, receiver_leaves: [WebView], taxonomy: data_disclosure, source: base}
  - {method: evaluateJavascript, receiver_leaves: [WebView], taxonomy: data_disclosure, source: base}
  - {method: addJavascriptInterface, receiver_leaves: [WebView], taxonomy: data_disclosure, source: base}
  - {method: execute, receiver_prefixes: ["okhttp3.", "retrofit2."], taxonomy: data_disclosure, source: base}
  - {method: enqueue, receiver_prefixes: ["okhttp3.", "retrofit2."], taxonomy: data_disclosure, source: base}
  # ---- file_mutation ----
  - {method: delete, receiver_leaves: [File], receiver_prefixes: ["java.nio.file."], taxonomy: file_mutation, source: base}
  - {method: renameTo, receiver_leaves: [File], taxonomy: file_mutation, source: base}
  - {method: mkdir, receiver_leaves: [File], taxonomy: file_mutation, source: base}
  - {method: mkdirs, receiver_leaves: [File], taxonomy: file_mutation, source: base}
  - {method: createNewFile, receiver_leaves: [File], taxonomy: file_mutation, source: base}
  - {method: append, receiver_leaves: [FileWriter, BufferedWriter], receiver_prefixes: ["java.nio.file."], taxonomy: file_mutation, source: base}
  - {method: write, receiver_leaves: [FileOutputStream, FileWriter, RandomAccessFile, BufferedWriter, BluetoothOutputStream, UsbOutputStream, NfcOutputStream, ProtocolWriter], receiver_prefixes: ["java.nio.file."], taxonomy: file_mutation, source: base}
