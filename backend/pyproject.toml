[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-apk-tracer-backend"
version = "0.1.0"
description = "Local APK static analysis backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "PyYAML==6.0.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
dev = ["ruff>=0.5,<1.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
